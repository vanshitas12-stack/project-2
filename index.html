<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Photo Gallery</h1>
    <p>Hover over an image to see the smooth zoom effect.</p>
  </header>

  <main class="gallery">
    <div class="card"><img src="https://picsum.photos/id/1015/800/600" alt="Mountain landscape"></div>
    <div class="card"><img src="https://picsum.photos/id/1016/800/600" alt="Forest landscape"></div>
    <div class="card"><img src="https://picsum.photos/id/1018/800/600" alt="Rocky mountain"></div>
    <div class="card"><img src="https://picsum.photos/id/1025/800/600" alt="Dog"></div>
    <div class="card"><img src="https://picsum.photos/id/1035/800/600" alt="River and mountains"></div>
    <div class="card"><img src="https://picsum.photos/id/1043/800/600" alt="Beach"></div>
    <div class="card"><img src="https://picsum.photos/id/1069/800/600" alt="City architecture"></div>
    <div class="card"><img src="https://picsum.photos/id/1074/800/600" alt="Waterfall"></div>
  </main>
</body>
</html>
